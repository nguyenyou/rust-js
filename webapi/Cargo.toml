# The webapi crate as a Cargo dependency (ADR 0101): rustc checks it, as
# webapi/build.sh does, and rust-js reads its metadata (ADR 0024).
[package]
name = "rust-js-webapi"
version = "0.0.2"
edition = "2024"
description = "The web platform for rust-js programs: DOM bindings generated from WebIDL"
license = "MIT"
repository = "https://github.com/rust-js-lang/rust-js"
readme = "README.md"
# Its Rust, not the repository's tools that build or generate it.
include = ["src", "README.md"]

[lib]
name = "webapi"
path = "src/lib.rs"

[dependencies]
js = { package = "rust-js-builtins", path = "../builtins", version = "~0.0.1" }

# rust-js compiles with `--cfg=rust_js` (ADR 0113): a `cfg` Cargo checks for.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_js)"] }
