<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rust-js in the browser</title>
    <style>
      :root {
        --bg: #fbfbfa;
        --fg: #1d1d1b;
        --muted: #6b6b66;
        --panel: #f1f0ec;
        --border: #deddd6;
        --bad: #a3321f;
        --good: #2f6b3a;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161614;
          --fg: #e8e7e2;
          --muted: #9a998f;
          --panel: #1f1f1c;
          --border: #34332e;
          --bad: #ef8a78;
          --good: #8fcf98;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, sans-serif;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      .panes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 12px;
      }
      textarea,
      pre {
        box-sizing: border-box;
        width: 100%;
        min-height: 420px;
        margin: 0;
        padding: 10px;
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        font: 13px/1.45 ui-monospace, monospace;
        overflow: auto;
      }
      pre {
        white-space: pre-wrap;
      }
      button {
        margin: 12px 0;
        padding: 6px 14px;
        font: inherit;
      }
      #status.bad {
        color: var(--bad);
      }
      #status.good {
        color: var(--good);
      }
      table {
        border-collapse: collapse;
        margin-top: 12px;
      }
      td {
        padding: 2px 16px 2px 0;
        font-variant-numeric: tabular-nums;
      }
      td:first-child {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>rust-js in the browser</h1>
    <p>rustc's front end and rust-js, as WebAssembly. No server compiles anything.</p>
    <button id="compile" disabled>Compile</button>
    <span id="status">Loading…</span>
    <div class="panes">
      <textarea id="source" spellcheck="false" aria-label="Rust source"></textarea>
      <pre id="output" aria-label="Generated JavaScript"></pre>
    </div>
    <table id="stats"></table>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
