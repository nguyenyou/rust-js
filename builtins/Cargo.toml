# The js crate as a Cargo dependency (ADR 0101): rustc checks it, as
# builtins/build.sh does, and rust-js reads its metadata (ADR 0102).
[package]
name = "rust-js-builtins"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "js"
path = "src/lib.rs"

# rust-js compiles with `--cfg=rust_js` (ADR 0113): a `cfg` Cargo checks for.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_js)"] }
