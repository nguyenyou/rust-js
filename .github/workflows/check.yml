name: Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      # The corpus runs its cases under Node too, whose TypeScript runner
      # needs Node 22.18 or later.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: bun install --frozen-lockfile
      - run: bunx --bun playwright install --with-deps chromium
      - run: bun run fmt:check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - run: bun test
      - run: bun run --cwd examples/vite-react build

  # rustc's own run-pass UI tests, against the known failures (ADR 0089).
  rustc-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: bun install --frozen-lockfile
      - run: bun run test:rustc

  wasm-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install pinned toolchain and targets
        run: |
          rustup show
          rustup target add wasm32-wasip1 wasm32-unknown-unknown
      - name: Prepare the pinned rustc frontend
        run: |
          git init -q wasm/rustc
          git -C wasm/rustc remote add origin https://github.com/rust-lang/rust.git
          git -C wasm/rustc sparse-checkout set --cone compiler library/proc_macro
          git -C wasm/rustc fetch -q --depth=1 --filter=blob:none origin "$(bun scripts/toolchain.ts commit)"
          git -C wasm/rustc checkout -q FETCH_HEAD
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: wasm-check-${{ runner.os }}-${{ hashFiles('wasm/Cargo.lock', 'wasm/patches/*', 'wasm/.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: wasm-check-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx --bun playwright install --with-deps chromium
      - name: Build WASM from the candidate sources
        run: bun run wasm
      - name: Require native snapshots and browser parity
        env:
          RUST_JS_REQUIRE_WASM: '1'
        run: bun test test/snapshots.test.ts test/playground.test.ts
