# Build the in-browser playground (rust-js + rustc's front end, as Wasm) and
# deploy it to GitHub Pages. Run it by hand from the Actions tab.
#
# Compiling rustc's front end takes many minutes here, so if a prebuilt
# rust-js.wasm was published for exactly these sources (wasm/prebuilt.sh
# publish), it's downloaded instead. Otherwise it's built from source.
name: Deploy playground

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TOOLCHAIN: nightly-2026-03-25
  # The rust-lang/rust commit that nightly was built from (see wasm/README.md).
  RUSTC_COMMIT: 362211dc29abc4e8f8cfc384740237f144929b03

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use a prebuilt rust-js.wasm, if one matches these sources
        id: prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if wasm/prebuilt.sh fetch; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal \
            --component llvm-tools \
            --target wasm32-wasip1 --target wasm32-unknown-unknown

      # Only compiler/ and library/proc_macro, and only this one commit.
      - name: Fetch rustc's source at the pinned commit
        if: steps.prebuilt.outputs.found != 'true'
        run: |
          git init -q wasm/rustc
          cd wasm/rustc
          git remote add origin https://github.com/rust-lang/rust.git
          git sparse-checkout set --cone compiler library/proc_macro
          git fetch -q --depth=1 --filter=blob:none origin "$RUSTC_COMMIT"
          git checkout -q FETCH_HEAD

      - uses: actions/cache@v6
        if: steps.prebuilt.outputs.found != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: wasm-${{ runner.os }}-${{ hashFiles('wasm/Cargo.lock', 'wasm/patches/*', 'wasm/.cargo/config.toml') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: Build rust-js.wasm
        if: steps.prebuilt.outputs.found != 'true'
        run: wasm/build.sh

      # build.sh stages the sysroot itself; a prebuilt binary still needs it.
      - name: Stage the sysroot
        if: steps.prebuilt.outputs.found == 'true'
        run: wasm/stage-sysroot.sh

      - uses: oven-sh/setup-bun@v2

      - name: Build the static site
        working-directory: wasm/web
        run: |
          bun install --frozen-lockfile
          bun build.ts

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: wasm/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
