name: rustc tests

# Tests that build a native program each, which macOS makes slow, run on
# Linux (AGENTS.md): rustc's own run-pass UI tests, run as JS (ADR 0089), the
# ones named or, with none named, all of them, split across machines and
# checked as one run against test/rustc-known-failures.txt; or, with
# `fuzz_seeds`, a batch of generated programs (ADR 0092), split the same way;
# or, with `mutations`, known bugs put back into the compiler, which the
# tests must catch (ADR 0093).
on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Tests or directories under tests/ui, separated by spaces, like "derives/ consts/std/iter.rs". Empty: all of them.'
        required: false
        default: ''
      bless:
        description: 'With all of them: write the known failures anew, as an artifact to commit.'
        type: boolean
        default: false
      fuzz_seeds:
        description: 'Instead: how many generated programs to run, like "600". Empty: none.'
        required: false
        default: ''
      fuzz_start:
        description: 'The first generated program''s seed.'
        required: false
        default: '1'
      mutations:
        description: 'Instead: put back each known bug, and check its tests catch it.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rustc-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tests named, each against what the known failures say of it.
  some:
    if: inputs.tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rustc-tests-setup
      - name: Run the tests named
        env:
          TESTS: ${{ inputs.tests }}
        # Split on spaces, with no globbing: each word is a test or a directory.
        run: |
          set -f
          bun scripts/rustc-suite.ts --compiler=target/release/rust-js $TESTS

  # rust-js, built once for the shards: a release build, as it's run some
  # 2,700 times, and the binary finds the toolchain where every runner has it.
  build:
    if: inputs.tests == '' && !inputs.mutations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-rust-js
      - uses: actions/upload-artifact@v7
        with:
          name: rust-js
          path: target/release/rust-js
          retention-days: 1

  # All of them: every sixth test on each of six machines.
  shard:
    needs: build
    if: inputs.fuzz_seeds == '' && !inputs.mutations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rustc-tests-setup
        with:
          build: 'false'
      - uses: actions/download-artifact@v8
        with:
          name: rust-js
          path: bin
      # An artifact keeps a file's contents, not its permissions.
      - run: chmod +x bin/rust-js
      - name: Run shard ${{ matrix.shard }} of 6
        run: bun scripts/rustc-suite.ts --compiler=bin/rust-js --shard=${{ matrix.shard }}/6 --out=results-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.shard }}
          path: results-${{ matrix.shard }}.json
          retention-days: 7

  # The shards as one run: checked against the known failures, or blessed.
  report:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Check against the known failures
        if: ${{ !inputs.bless }}
        run: bun scripts/rustc-suite.ts --merge results/*.json
      - name: Write the known failures anew
        if: ${{ inputs.bless }}
        run: bun scripts/rustc-suite.ts --merge --bless results/*.json
      - if: ${{ inputs.bless }}
        uses: actions/upload-artifact@v7
        with:
          name: rustc-known-failures
          path: |
            test/rustc-known-failures.txt
            test/rustc-native-failures.txt
            test/rustc-out-of-scope.txt
            test/rustc-inventory.txt

  # Generated programs, a sixth of the seeds on each of six machines, with
  # the build job's rust-js. One that differs is reduced, and kept.
  fuzz:
    needs: build
    if: inputs.fuzz_seeds != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rustc-tests-setup
        with:
          build: 'false'
      - uses: actions/download-artifact@v8
        with:
          name: rust-js
          path: bin
      - run: chmod +x bin/rust-js
      - name: Run part ${{ matrix.part }} of 6
        env:
          START: ${{ inputs.fuzz_start }}
          SEEDS: ${{ inputs.fuzz_seeds }}
          PART: ${{ matrix.part }}
          RUST_JS_COMPILER: bin/rust-js
          FUZZ_REPORT: '1'
        run: |
          # Whole numbers, or the batch fails, not as a run of none.
          case "$SEEDS" in ''|*[!0-9]*|0) echo "fuzz_seeds=$SEEDS: a whole number, at least 1"; exit 1;; esac
          case "$START" in ''|*[!0-9]*) echo "fuzz_start=$START: a whole number"; exit 1;; esac
          touch "ran-$PART.txt"
          per=$(( (SEEDS + 5) / 6 ))
          first=$(( START + (PART - 1) * per ))
          count=$(( SEEDS - (PART - 1) * per ))
          if [ "$count" -gt "$per" ]; then count=$per; fi
          if [ "$count" -le 0 ]; then echo "no seeds for this part"; exit 0; fi
          set +e
          FUZZ_START=$first FUZZ_SEEDS=$count bun test test/fuzz.test.ts > fuzz.log 2>&1
          status=$?
          cat fuzz.log
          # The seeds this part ran to the end, for the batch to be counted.
          grep -oE '^seed [0-9]+:' fuzz.log | tr -d ':' | awk '{ print $2 }' > "ran-$PART.txt"
          {
            echo "### Seeds $first to $(( first + count - 1 ))"
            echo
            grep -E '^seed [0-9]+:' fuzz.log | awk '{ print $3 }' | sort | uniq -c | awk '{ print "- " $2 ": " $1 }'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.part }}
          path: target/fuzz/
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-ran-${{ matrix.part }}
          path: ran-${{ matrix.part }}.txt
          if-no-files-found: ignore
          retention-days: 7

  # The batch is every seed asked for, each run once, or it isn't one.
  fuzz-report:
    needs: fuzz
    if: always() && inputs.fuzz_seeds != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: fuzz-ran-*
          path: ran
          merge-multiple: true
      - name: Check every seed ran
        env:
          START: ${{ inputs.fuzz_start }}
          SEEDS: ${{ inputs.fuzz_seeds }}
        run: |
          case "$SEEDS" in ''|*[!0-9]*|0) echo "fuzz_seeds=$SEEDS: a whole number, at least 1"; exit 1;; esac
          case "$START" in ''|*[!0-9]*) echo "fuzz_start=$START: a whole number"; exit 1;; esac
          cat ran/*.txt 2>/dev/null | sort -n > ran.txt
          seq "$START" $(( START + SEEDS - 1 )) > asked.txt
          if ! diff -q asked.txt ran.txt > /dev/null; then
            echo "asked for $SEEDS seeds from $START; ran $(wc -l < ran.txt), and these differ:"
            diff asked.txt ran.txt | head -20
            exit 1
          fi
          echo "all $SEEDS seeds from $START ran, each once"

  # Known bugs, each put back into the compiler, one at a time: the tests
  # named for each must fail against it, and pass as the compiler is.
  mutations:
    if: inputs.mutations
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rustc-tests-setup
        with:
          build: 'false'
      # Else what the last run left: dependencies aren't compiled again,
      # only rust-js, for each mutation.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mutants/target
          key: mutants-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: mutants-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      # The corpus ships each case through Vite too.
      - run: bun install --frozen-lockfile
      - name: Put back each known bug
        run: bun scripts/mutations.ts
