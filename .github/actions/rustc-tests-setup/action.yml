name: Set up for rustc's tests
description: Bun, Node, the pinned Rust toolchain, rustc's tests/ui at the toolchain's commit (ADR 0089), and, unless another job built it, rust-js.
inputs:
  build:
    description: "'true' to build rust-js here; 'false' when a build job's is downloaded instead."
    default: 'true'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'
    # Each case's JS runs under Node too, whose TypeScript runner needs 22.18 or later.
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    # rust-js loads the toolchain's rustc at run time, and each test's native
    # side is built with it, so every job needs it, built or not.
    - name: Install the pinned Rust toolchain
      shell: bash
      run: rustup show
    - if: inputs.build == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/debug
        key: rustc-tests-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
        restore-keys: rustc-tests-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
    - if: inputs.build == 'true'
      name: Build rust-js
      shell: bash
      run: cargo build --locked
    - uses: actions/cache@v6
      with:
        path: target/rustc-tests
        key: rustc-tests-ui-${{ hashFiles('rust-toolchain.toml') }}
    - name: Fetch rustc's tests
      shell: bash
      run: bun scripts/rustc-tests.ts
