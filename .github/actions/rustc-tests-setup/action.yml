name: Set up for rustc's tests
description: Bun, Node, the pinned Rust toolchain, a build of rust-js, and rustc's tests/ui at the toolchain's commit (ADR 0089).
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'
    # Each case's JS runs under Node too, whose TypeScript runner needs 22.18 or later.
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Install the pinned Rust toolchain
      shell: bash
      run: rustup show
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/debug
          target/rustc-tests
        key: rustc-tests-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
        restore-keys: rustc-tests-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
    - name: Build rust-js
      shell: bash
      run: cargo build --locked
    - name: Fetch rustc's tests
      shell: bash
      run: bun scripts/rustc-tests.ts
