name: Set up for rustc's tests
description: Bun and the workspace's packages, Node, the pinned Rust toolchain, rustc's tests/ui at the toolchain's commit (ADR 0089), and, unless another job built it, rust-js.
inputs:
  build:
    description: "'true' to build rust-js here, at target/release/rust-js; 'false' when a build job's is downloaded instead."
    default: 'true'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'
    # Each case's JS runs under Node too, whose TypeScript runner needs 22.18 or later.
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    # rust-js loads the toolchain's rustc at run time, and each test's native
    # side is built with it, so every job needs it, built or not.
    # What each case's JS imports: @rust-js/runtime, the workspace's (ADR 0103).
    - name: Install the packages
      shell: bash
      run: bun install --frozen-lockfile
    - name: Install the pinned Rust toolchain
      shell: bash
      run: rustup show
    # A release build, as the list of known failures is made with: a debug
    # build's deeper stack overflows on tests a release build passes.
    - if: inputs.build == 'true'
      uses: ./.github/actions/build-rust-js
    - uses: actions/cache@v6
      with:
        path: target/rustc-tests
        key: rustc-tests-ui-${{ hashFiles('rust-toolchain.toml') }}
    - name: Fetch rustc's tests
      shell: bash
      run: bun scripts/rustc-tests.ts
