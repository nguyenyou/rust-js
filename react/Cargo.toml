# The react crate as a Cargo dependency (ADR 0101): rustc checks it, as
# react/build.sh does, for the React release `RUST_JS_REACT` names, or the
# latest the crate knows (ADR 0043); build.rs gives its `cfg`s.
[package]
name = "rust-js-react"
version = "0.0.1"
edition = "2024"
description = "React for rust-js: components written in Rust, compiled to the JSX you'd write"
license = "MIT"
repository = "https://github.com/rust-js-lang/rust-js"
readme = "README.md"
# Its Rust, and what build.rs reads, not the repository's tools that build
# or generate it.
include = ["src", "build.rs", "versions.json", "README.md"]
build = "build.rs"

[lib]
name = "react"
path = "src/lib.rs"

[dependencies]
js = { package = "rust-js-builtins", path = "../builtins", version = "~0.0.1" }
webapi = { package = "rust-js-webapi", path = "../webapi", version = "~0.0.1" }

# rust-js compiles with `--cfg=rust_js` (ADR 0113): a `cfg` Cargo checks for.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_js)"] }
