# The app's crate, src/App.rs, which the Vite plugin builds with Cargo, and
# an editor's rust-analyzer checks (ADR 0114). Its crates are npm packages,
# named by version, which rust-js-patch, the app's `postinstall`, tells
# Cargo are in node_modules; rust-js's own example has them by path.
[package]
name = "app"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/App.rs"

[dependencies]
js = { package = "rust-js-builtins", path = "../../builtins" }
react = { package = "rust-js-react", path = "../../react" }
webapi = { package = "rust-js-webapi", path = "../../webapi" }

# rust-js compiles with `--cfg=rust_js` (ADR 0113): a `cfg` Cargo checks for,
# here too, in what `js::import!` expands to.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_js)"] }

# Standalone: not part of a workspace of the directories above it.
[workspace]
